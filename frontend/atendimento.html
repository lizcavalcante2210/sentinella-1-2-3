<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Paciente</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="logo-area">

        <img
            src="logo.png"
            class="hospital-logo"
            alt="Hospital Conhecimento"
        >

        <div class="logo-line"></div>

        <h2>Cadastro de Paciente</h2>

        <p class="subtitle">
            Hospital Conhecimento
        </p>

    </div>


    <div class="formulario">

        <form id="formPaciente">

            <div class="form-grid">

                <!-- DADOS PESSOAIS -->

                <div>
                    <label for="nome">Nome Completo</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Nome Completo"
                        required
                    >
                </div>


                <div>
                    <label for="cpf">CPF</label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="CPF"
                        required
                    >
                </div>


                <div>
                    <label for="nascimento">Data de Nascimento</label>

                    <input
                        type="date"
                        id="nascimento"
                        required
                    >
                </div>


                <div>
                    <label for="sexo">Sexo</label>

                    <select id="sexo" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="Masculino">
                            Masculino
                        </option>

                        <option value="Feminino">
                            Feminino
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                </div>


                <!-- CONTATO -->

                <div>
                    <label for="telefone">Telefone</label>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="Telefone"
                    >
                </div>


                <div>
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="E-mail"
                    >
                </div>


                <!-- ENDEREÇO -->

                <div>
                    <label for="endereco">Endereço</label>

                    <input
                        type="text"
                        id="endereco"
                        placeholder="Endereço"
                    >
                </div>


                <div>
                    <label for="cidade">Cidade</label>

                    <input
                        type="text"
                        id="cidade"
                        placeholder="Cidade"
                    >
                </div>


                <div>
                    <label for="estado">Estado</label>

                    <input
                        type="text"
                        id="estado"
                        placeholder="Estado"
                    >
                </div>


                <!-- CONVÊNIO -->

                <div>
                    <label for="tipo">Tipo de Atendimento</label>

                    <select id="tipo">

                        <option value="Convênio">
                            Convênio
                        </option>

                        <option value="Particular">
                            Particular
                        </option>

                    </select>

                </div>


                <div>
                    <label for="convenio">Convênio</label>

                    <input
                        type="text"
                        id="convenio"
                        placeholder="Nome do Convênio"
                    >
                </div>


                <!-- INFORMAÇÕES MÉDICAS -->

                <div>
                    <label for="alergias">Alergias</label>

                    <input
                        type="text"
                        id="alergias"
                        placeholder="Ex: Dipirona, Penicilina..."
                    >
                </div>


                <div>
                    <label for="tipoSanguineo">
                        Tipo Sanguíneo
                    </label>

                    <select id="tipoSanguineo">

                        <option value="">
                            Selecione
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <div class="full">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        placeholder="Observações médicas"
                    ></textarea>

                </div>


                <!-- BOTÃO -->

                <div class="full">

                    <button
                        type="submit"
                        id="btnCadastrar"
                    >
                        Cadastrar Paciente
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const formulario =
        document.getElementById("formPaciente");

    const botao =
        document.getElementById("btnCadastrar");


    formulario.addEventListener("submit", async function (event) {

        event.preventDefault();


        // Muda o botão para informar que está enviando

        botao.disabled = true;

        botao.innerText = "CADASTRANDO...";


        const paciente = {

            nome:
                document.getElementById("nome").value.trim(),

            cpf:
                document.getElementById("cpf").value.trim(),

            nascimento:
                document.getElementById("nascimento").value,

            sexo:
                document.getElementById("sexo").value,

            telefone:
                document.getElementById("telefone").value.trim(),

            email:
                document.getElementById("email").value.trim(),

            endereco:
                document.getElementById("endereco").value.trim(),

            cidade:
                document.getElementById("cidade").value.trim(),

            estado:
                document.getElementById("estado").value.trim(),

            tipo:
                document.getElementById("tipo").value,

            convenio:
                document.getElementById("convenio").value.trim(),

            alergias:
                document.getElementById("alergias").value.trim(),

            tipoSanguineo:
                document.getElementById("tipoSanguineo").value,

            observacoes:
                document.getElementById("observacoes").value.trim()

        };


        console.log("Enviando paciente:", paciente);


        try {

            const resposta = await fetch("/atendimento", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(paciente)

            });


            const dados = await resposta.json();


            console.log("Resposta do servidor:", dados);


            if (!resposta.ok) {

                throw new Error(
                    dados.mensagem ||
                    dados.erro ||
                    "Erro ao cadastrar paciente"
                );

            }


            alert(
                "Paciente cadastrado com sucesso!"
            );


            // Limpa o formulário

            formulario.reset();


        } catch (erro) {

            console.error(
                "ERRO AO CADASTRAR:",
                erro
            );


            alert(
                "Não foi possível cadastrar o paciente.\n\n" +
                erro.message
            );


        } finally {

            botao.disabled = false;

            botao.innerText =
                "CADASTRAR PACIENTE";

        }

    });

});

</script>

</body>

</html>
